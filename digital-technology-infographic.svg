<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Infographic về công nghệ số</title>
  <desc id="desc">Bốn nền tảng của công nghệ số: trí tuệ nhân tạo, điện toán đám mây, Internet vạn vật và an toàn dữ liệu.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f2c59"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#08244d" flood-opacity=".25"/>
    </filter>
  </defs>

  <rect width="1200" height="800" fill="#f4f8ff"/>
  <rect width="1200" height="270" rx="0" fill="url(#bg)"/>
  <circle cx="1070" cy="80" r="170" fill="#60a5fa" opacity=".12"/>
  <circle cx="1120" cy="210" r="95" fill="#bfdbfe" opacity=".1"/>

  <g fill="#fff" font-family="Arial, Helvetica, sans-serif">
    <text x="80" y="86" font-size="23" font-weight="700" letter-spacing="4">CÔNG NGHỆ SỐ</text>
    <text x="80" y="153" font-size="52" font-weight="700">Kết nối tương lai</text>
    <text x="80" y="199" font-size="24" opacity=".9">Bốn nền tảng đang thay đổi cách chúng ta sống và làm việc</text>
  </g>

  <g font-family="Arial, Helvetica, sans-serif" filter="url(#shadow)">
    <rect x="70" y="325" width="500" height="170" rx="22" fill="#fff"/>
    <rect x="630" y="325" width="500" height="170" rx="22" fill="#fff"/>
    <rect x="70" y="550" width="500" height="170" rx="22" fill="#fff"/>
    <rect x="630" y="550" width="500" height="170" rx="22" fill="#fff"/>
  </g>

  <g font-family="Arial, Helvetica, sans-serif">
    <g fill="#2563eb">
      <circle cx="135" cy="390" r="38"/>
      <path d="M116 391h38M135 372v38M121 377l28 28M149 377l-28 28" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
      <text x="200" y="383" font-size="28" font-weight="700">Trí tuệ nhân tạo</text>
      <text x="200" y="421" font-size="19" fill="#52637d">Tự động hóa và hỗ trợ ra quyết định</text>
    </g>
    <g fill="#0ea5a4">
      <circle cx="695" cy="390" r="38"/>
      <path d="M674 397c-18-22 18-42 30-20 15-21 47 9 27 28h-55c-9 0-13-7-2-8z" fill="none" stroke="#fff" stroke-width="5"/>
      <text x="760" y="383" font-size="28" font-weight="700">Điện toán đám mây</text>
      <text x="760" y="421" font-size="19" fill="#52637d">Lưu trữ và làm việc mọi lúc, mọi nơi</text>
    </g>
    <g fill="#f59e0b">
      <circle cx="135" cy="615" r="38"/>
      <circle cx="135" cy="615" r="12" fill="none" stroke="#fff" stroke-width="5"/>
      <path d="M135 585v18M135 627v18M105 615h18M147 615h18" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
      <text x="200" y="608" font-size="28" font-weight="700">Internet vạn vật (IoT)</text>
      <text x="200" y="646" font-size="19" fill="#52637d">Thiết bị kết nối, thu thập dữ liệu thông minh</text>
    </g>
    <g fill="#7c3aed">
      <circle cx="695" cy="615" r="38"/>
      <rect x="677" y="596" width="36" height="33" rx="6" fill="none" stroke="#fff" stroke-width="5"/>
      <path d="M685 596v-8c0-14 20-14 20 0v8M686 614h18" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
      <text x="760" y="608" font-size="28" font-weight="700">An toàn dữ liệu</text>
      <text x="760" y="646" font-size="19" fill="#52637d">Bảo vệ thông tin và quyền riêng tư số</text>
    </g>
  </g>

  <text x="600" y="770" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#52637d">Công nghệ số • Đổi mới • Kết nối • Phát triển bền vững</text>
</svg>
